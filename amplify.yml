version: 1
applications:
  - appRoot: ui
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: ui/.next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - ui/.next/cache/**/*
